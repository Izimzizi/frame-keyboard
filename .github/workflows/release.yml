name: Release

# Push a tag to build the bundle and publish a release with the archives attached.
#   v1.0.0          stable release (marked Latest)
#   v1.0.0-dev.1    dev release (marked Pre-release); -rc.1, -beta.2 and so on work too
# The version shown in the bundle and in the file names comes from the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Take the version from the tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - run: npm run build
      - name: Package
        run: |
          name="frame-keyboard-${GITHUB_REF_NAME#v}"
          mkdir -p "stage/frame-keyboard"
          cp dist/bundle.js injector/frame_keyboard_injector.py contrib/frame-keyboard.service \
             install.sh uninstall.sh README.md LICENSE "stage/frame-keyboard/"
          chmod 755 stage/frame-keyboard/install.sh stage/frame-keyboard/uninstall.sh stage/frame-keyboard/frame_keyboard_injector.py
          tar --owner=0 --group=0 --numeric-owner -czf "$name.tar.gz" -C stage frame-keyboard
          mkdir -p stage/frame-keyboard-windows
          cp dist/bundle.js windows/frame_keyboard_injector.ps1 windows/frame_keyboard_launcher.vbs windows/install.ps1 windows/install.cmd windows/uninstall.cmd \
             README.md LICENSE stage/frame-keyboard-windows/
          (cd stage && zip -qr "../$name-windows.zip" frame-keyboard-windows)
          sha256sum "$name.tar.gz" "$name-windows.zip" > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--latest"
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" frame-keyboard-*.tar.gz frame-keyboard-*-windows.zip SHA256SUMS \
            --title "frame-keyboard ${GITHUB_REF_NAME#v}" --generate-notes $flags
